<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img">
<title>Record mapping with grouped sources, transformation arrows, and an expandable list query</title>
<style>text{font-family:system-ui,sans-serif;fill:#263244;font-size:15px}.small{font-size:12px;fill:#596579}.label{font-size:13px;fill:#596579}.title{font-size:18px;font-weight:600}.code{font-family:monospace;font-size:13px}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7b8796"/></marker></defs>
<rect width="1000" height="610" fill="#ffffff"/>
<rect x="20" y="20" width="960" height="570" rx="8" fill="#fdf3e5" stroke="#dce2e9"/>
<text x="40" y="53" class="title" text-anchor="start">⌄ Build FulfilmentRequest</text>
<rect x="50" y="82" width="280" height="300" rx="8" fill="#fff" stroke="#dce2e9"/>
<rect x="670" y="82" width="280" height="300" rx="8" fill="#fff" stroke="#dce2e9"/>
<text x="70" y="112" class="title" text-anchor="start">order</text>
<text x="690" y="112" class="title" text-anchor="start">FulfilmentRequest</text>
<text x="90" y="152" class="code" text-anchor="start">id</text>
<text x="690" y="152" class="code" text-anchor="start">orderId</text>
<path d="M 330 147 H 667" fill="none" stroke="#7b8796" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="90" y="202" class="code" text-anchor="start">total</text>
<text x="690" y="202" class="code" text-anchor="start">amountInCents</text>
<path d="M 330 197 H 667" fill="none" stroke="#7b8796" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="420" y="182" width="160" height="25" rx="0" fill="#fdf3e5" stroke="none"/>
<text x="500" y="199" class="code" text-anchor="middle">× 100</text>
<text x="90" y="287" class="code" text-anchor="start">name</text>
<text x="690" y="287" class="code" text-anchor="start">customerName</text>
<path d="M 330 282 H 667" fill="none" stroke="#7b8796" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="90" y="337" class="code" text-anchor="start">email</text>
<text x="690" y="337" class="code" text-anchor="start">customerEmail</text>
<path d="M 330 332 H 667" fill="none" stroke="#7b8796" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="420" y="317" width="160" height="25" rx="0" fill="#fdf3e5" stroke="none"/>
<text x="500" y="334" class="code" text-anchor="middle">toLowerAscii()</text>
<rect x="69" y="222" width="240" height="140" rx="4" fill="#fff" stroke="#dce2e9"/>
<text x="82" y="245" class="label" text-anchor="start">customer</text>
<text x="90" y="287" class="code" text-anchor="start">name</text>
<text x="90" y="337" class="code" text-anchor="start">email</text>
<rect x="50" y="409" width="900" height="153" rx="8" fill="#fff" stroke="#dce2e9"/>
<text x="70" y="438" class="code" text-anchor="start">⌄ order.items → items[]</text>
<text x="85" y="470" class="code" text-anchor="start">from var item in order.items</text>
<text x="85" y="495" class="code" text-anchor="start">where item.quantity &gt; 0</text>
<text x="85" y="520" class="code" text-anchor="start">select {sku: item.sku, quantity: item.quantity}</text>
</svg>
