<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><title>Template selection test</title></head>
<body><div id="root"></div><script type="module">
import React from 'react';
import {createRoot} from 'react-dom/client';
import {FlowSvg} from '../../src/flow-svg';
const data = await (await fetch('/template-selection.json')).json();
createRoot(document.getElementById('root')).render(React.createElement(FlowSvg, {
  data, ready: true, onSelect: value => { window.selectedTemplate = value; }, onToggle() {},
}));
</script></body></html>
